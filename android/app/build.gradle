plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// ─── 版本号（从 pubspec.yaml 解析，避免 flutterVersionCode CI 不兼容） ───
def pubspecFile = file('../../pubspec.yaml')
def flutterVersionName = '1.0.0'
def flutterVersionCode = '1'
if (pubspecFile.exists()) {
    def matcher = (pubspecFile.text =~ /(?m)^version:\s*(\S+)/)
    if (matcher.find()) {
        def v = matcher.group(1)
        def parts = v.split('\\+')
        flutterVersionName = parts[0]
        if (parts.length > 1) flutterVersionCode = parts[1]
    }
}

// 签名配置
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.mjiutang.ngskg"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.mjiutang.ngskg.wear"
        minSdkVersion 26
        targetSdk 36
        versionCode flutterVersionCode.toInteger() * 10 + 1
        versionName flutterVersionName
        // fat APK：只保留手表常见架构，避免打包 x86/x86_64 增大体积
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Android 15+（Wear OS 6）要求原生库支持 16KB 内存页对齐。
    // 保持 useLegacyPackaging=false（默认），AGP 8.5+ 会以 16KB 对齐打包 .so，
    // 避免 dlopen 失败导致的启动闪退。
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

flutter {
    source '../..'
}

// ─── AGP 8.x workaround: Flutter Gradle Plugin's APK copy via deprecated ───
// variant.outputs may not work, leaving flutter-apk/ empty.
// This ensures the APK is always copied after assembleDebug.
afterEvaluate {
    tasks.matching { it.name.startsWith('assemble') && it.name.endsWith('Debug') }.configureEach { task ->
        task.doLast {
            copy {
                from "${project.buildDir}/outputs/apk/debug/"
                into "${project.buildDir}/outputs/flutter-apk/"
                include "*.apk"
            }
        }
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
    implementation "androidx.media:media:1.7.0"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    // 注意：已移除 com.google.android.play:core:1.10.3
    // 该旧版 Play Core 在 Android 14+（Wear OS 6）会因未指定
    // RECEIVER_EXPORTED/RECEIVER_NOT_EXPORTED 而抛 SecurityException 闪退。
    // 本应用不使用应用内更新 / 延迟组件，无需 Play Core。
    // Wear OS Tiles — 系统快捷磁贴（显示当前播放状态，点击进入应用）
    implementation "androidx.wear.tiles:tiles:1.4.1"
    // Tiles 依赖 protolayout 和 guava（协程桥接）
    implementation "androidx.wear.protolayout:protolayout:1.2.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.9.0"
}
