name: ngskg_plus
description: NGS-KG+ - Cross-platform music player based on KuGouMusic API
publish_to: 'none'
version: 1.5.1-preview+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Network
  dio: ^5.4.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  # Audio
  just_audio: ^0.9.40
  audio_service: ^0.18.19
  audio_session: ^0.1.25 # OHOS: managed by native AVSession
  # State
  provider: ^6.1.1
  # Local storage
  # sqflite: no OHOS port, replaced by custom OHOS relationalStore plugin
  path_provider: ^2.1.1
  path: ^1.9.0
  # UI
  cached_network_image: ^3.3.1
  palette_generator: ^0.3.3
  # Theme
  flex_color_scheme: ^8.0.2
  flutter_colorpicker: ^1.1.0
  # dynamic_color: Android 12+ only, not available on OHOS
  archive: ^4.0.0
  # Audio
  wakelock_plus: ^1.2.10
  # Utils
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.2
  file_picker: ^8.0.0
  crypto: ^3.0.3
  package_info_plus: ^8.0.0
  flutter_svg: ^2.0.10+1
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.4
  flutter_local_notifications: ^18.0.1
  # Lyrics
  ym_lyric: ^0.0.4
  flutter_lyric: ^3.0.6
  on_audio_query: ^2.9.0 # OHOS: replaced by custom mediaLibrary plugin
  flutter_markdown: ^0.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3



flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/config/
    - assets/icons/
  fonts:
    - family: HarmonyOS Sans
      fonts:
        - asset: assets/fonts/HarmonyOS_Sans_Regular.ttf
        - asset: assets/fonts/HarmonyOS_Sans_Medium.ttf
          weight: 500
        - asset: assets/fonts/HarmonyOS_Sans_Bold.ttf
          weight: 700
        - asset: assets/fonts/HarmonyOS_Sans_Light.ttf
          weight: 300

flutter_launcher_icons:
  android: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon.png"
  min_sdk_android: 21

