name: Build Release APK + GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.5.0-preview)'
        required: true
        default: 'v1.5.0-preview'
      release_name:
        description: 'Release name (e.g. NGS-KG+ v1.5.0-preview)'
        required: true
        default: 'NGS-KG+ v1.5.0-preview'
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        default: 'true'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ═══ Cache ═══

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/flutter
          key: flutter-${{ runner.os }}-3.44.0-stable
          restore-keys: |
            flutter-${{ runner.os }}-

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk
          key: android-sdk-${{ runner.os }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install Android SDK
        uses: android-actions/setup-android@v2

      - name: Create assets directories
        run: |
          mkdir -p assets/images
          mkdir -p assets/icons

      - name: Get dependencies
        run: flutter pub get

      # ═══ CI network config: replace China mirrors with global ones ═══
      - name: Use global Gradle/Maven mirrors for CI
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          sed -i '/maven.*aliyun/d' android/settings.gradle android/build.gradle

      # ── Build release APK (split-per-abi) ──
      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      # ── Build debug APK (split-per-abi) ──
      - name: Build debug APK
        run: flutter build apk --debug --split-per-abi

      # ── Upload artifacts ──
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: NGS-KG-${{ github.event.inputs.tag_name }}-release
          path: build/app/outputs/flutter-apk/*-release.apk

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: NGS-KG-${{ github.event.inputs.tag_name }}-debug
          path: build/app/outputs/flutter-apk/*-debug.apk

      # ── Create GitHub Release ──
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_name }}
          body: |
            # NGS-KG+ ${{ github.event.inputs.tag_name }}

            > 代号 **Nightcord** 来源于 QQ 群代号投票——至于为什么选这个，我也不知道。

            ## 下载

            | 架构 | 文件 |
            |------|------|
            | arm64-v8a | `NGS-KG-arm64-v8a-release.apk` |
            | armeabi-v7a | `NGS-KG-armeabi-v7a-release.apk` |
            | x86_64 | `NGS-KG-x86_64-release.apk` |

            也可在本页底部 Assets 下载。
          files: |
            build/app/outputs/flutter-apk/*-release.apk
            build/app/outputs/flutter-apk/*-debug.apk
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
