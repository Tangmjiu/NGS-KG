name: Release NGS-KG+ (All Platforms)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.5.0-preview)'
        required: true
        default: 'v1.5.0-preview'
      release_name:
        description: 'Release name (e.g. NGS-KG+ v1.5.0-preview Nightcord)'
        required: true
        default: 'NGS-KG+ v1.5.0-preview Nightcord'
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        default: 'true'
        type: boolean

jobs:
  # ═══════════════════════════════════════════════════════════
  #  Android Build
  # ═══════════════════════════════════════════════════════════
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: android

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install Android SDK
        uses: android-actions/setup-android@v2

      - name: Install SDK 36
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" 2>/dev/null || true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pubcache-android-${{ hashFiles('pubspec.lock') }}
          restore-keys: pubcache-android-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Create assets directories
        run: |
          mkdir -p assets/images
          mkdir -p assets/icons

      - name: Get dependencies
        run: flutter pub get

      - name: Use global Gradle/Maven mirrors for CI
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          sed -i '/maven.*aliyun/d' android/settings.gradle android/build.gradle

      # ── Build debug APK (split-per-abi) ──
      - name: Build debug APK
        run: flutter build apk --debug --split-per-abi --android-skip-build-dependency-validation

      # ── Build release APK (split-per-abi) ──
      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      # ── Upload each architecture separately ──
      - name: Upload debug APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk

      - name: Upload debug APK (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk

      - name: Upload debug APK (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-debug.apk

      - name: Upload release APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: android-release-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload release APK (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: android-release-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload release APK (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: android-release-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk

  # ═══════════════════════════════════════════════════════════
  #  Windows Build (x64 + arm64, ZIP + MSIX)
  # ═══════════════════════════════════════════════════════════
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: windows-desktop

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Rust
        run: rustup default stable

      - name: Ensure assets directories
        run: |
          mkdir -Force assets\icons
          mkdir -Force assets\images

      - name: Copy app icon to assets/icons
        run: Copy-Item windows\runner\resources\app_icon.ico assets\icons\ -Force

      - name: Create placeholder assets if missing
        run: |
          $placeholder = @"
          <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
            <rect width="100" height="100" fill="#2CA1F4"/>
            <text x="50" "65" text-anchor="middle" font-size="40" fill="white">♪</text>
          </svg>
          "@
          $required = @('ban.png', 'codecrash.png', 'loading.png', 'sthiswrong.png', 'supportme.png')
          foreach ($f in $required) {
            $p = "assets\images\$f"
            if (-not (Test-Path $p)) { Set-Content -Path $p -Value $placeholder -Encoding utf8 }
          }

      - name: Get dependencies
        run: flutter pub get

      # ── x64 Build ──
      - name: Build Windows x64 debug
        run: flutter build windows --debug

      - name: Build Windows x64 release
        run: flutter build windows --release

      - name: Create dist directory
        run: mkdir -Force dist

      - name: ZIP x64 debug
        run: Compress-Archive -Path build\windows\x64\runner\Debug\* -DestinationPath dist\ngskg-plus-windows-x64-debug.zip

      - name: ZIP x64 release
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\ngskg-plus-windows-x64-release.zip

      # ── Generate MSIX ──
      - name: Generate x64 MSIX
        run: dart run msix:create --version 1.5.0.0

      # ── Upload artifacts ──
      - name: Upload x64 debug ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-debug-zip
          path: dist\ngskg-plus-windows-x64-debug.zip

      - name: Upload x64 release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release-zip
          path: dist\ngskg-plus-windows-x64-release.zip

      - name: Upload x64 release MSIX
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release-msix
          path: build\windows\x64\runner\Release\msix\*.msix

  # ═══════════════════════════════════════════════════════════
  #  Watch Build
  # ═══════════════════════════════════════════════════════════
  build-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: watch

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install Android SDK
        uses: android-actions/setup-android@v2

      - name: Install SDK 36
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" 2>/dev/null || true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pubcache-watch-${{ hashFiles('pubspec.lock') }}
          restore-keys: pubcache-watch-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Create assets directories
        run: |
          mkdir -p assets/images
          mkdir -p assets/icons

      - name: Get dependencies
        run: flutter pub get

      - name: Use global Gradle/Maven mirrors for CI
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          sed -i '/maven.*aliyun/d' android/settings.gradle android/build.gradle

      - name: Build watch release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Build watch debug APK
        run: flutter build apk --debug --target-platform android-arm64 --android-skip-build-dependency-validation

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: watch-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: watch-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  # ═══════════════════════════════════════════════════════════
  #  Linux Build + Packaging
  # ═══════════════════════════════════════════════════════════
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: linux-desktop

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libayatana-appindicator3-dev flatpak flatpak-builder

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pubcache-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: pubcache-linux-

      - name: Create assets directories
        run: |
          mkdir -p assets/images
          mkdir -p assets/icons

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Build Linux debug
        run: flutter build linux --debug

      # ── Package as .deb ──
      - name: Package as .deb
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          DEB_DIR="dist/deb/ngskg-plus_${VERSION}_amd64"
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/256x256/apps"
          cp -r build/linux/x64/release/bundle/* "$DEB_DIR/usr/bin/"
          cat > "$DEB_DIR/DEBIAN/control" << EOF
          Package: ngskg-plus
          Version: $VERSION
          Architecture: amd64
          Maintainer: mjiutang <mjiutang@example.com>
          Description: NGS-KG+ Music Player
           A Flutter music player based on KuGou third-party API.
          Depends: libgtk-3-0, libnotify4, libayatana-appindicator3-1, libmpv2
          EOF
          cat > "$DEB_DIR/usr/share/applications/ngskg-plus.desktop" << EOF
          [Desktop Entry]
          Name=NGS-KG+
          Exec=/usr/bin/ngskg_plus
          Icon=ngskg
          Type=Application
          Categories=Audio;Music;Player;
          EOF
          cp assets/images/icon.png "$DEB_DIR/usr/share/icons/hicolor/256x256/apps/ngskg.png"
          dpkg-deb --build "$DEB_DIR" "dist/ngskg-plus_${VERSION}_amd64.deb"

      # ── Package as .flatpak ──
      - name: Package as .flatpak
        run: |
          cat > dist/com.mjiutang.ngskg.yml << EOF
          app-id: com.mjiutang.ngskg
          runtime: org.gnome.Platform
          runtime-version: '47'
          sdk: org.gnome.Sdk
          command: ngskg_plus
          modules:
            - name: ngskg
              buildsystem: simple
              build-commands:
                - mkdir -p /app/bin
                - cp -r * /app/bin/
                - chmod +x /app/bin/ngskg_plus
              sources:
                - type: dir
                  path: ../build/linux/x64/release/bundle
          finish-args:
            - --share=network
            - --share=ipc
            - --socket=x11
            - --socket=wayland
            - --socket=pulseaudio
            - --device=dri
            - --talk-name=org.kde.StatusNotifierWatcher
            - --talk-name=org.freedesktop.Notifications
          EOF
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.gnome.Platform//47 || true
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=dist/repo dist/build dist/com.mjiutang.ngskg.yml
          flatpak build-bundle dist/repo dist/ngskg-plus.flatpak com.mjiutang.ngskg

      # ── Generate PKGBUILD ──
      - name: Generate PKGBUILD
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          cat > dist/PKGBUILD << EOF
          pkgname=ngskg-plus
          pkgver=$VERSION
          pkgrel=1
          pkgdesc="NGS-KG+ Music Player (Flutter)"
          arch=('x86_64')
          url="https://github.com/Tangmjiu/NGS-KG"
          license=('MIT')
          depends=('gtk3' 'libayatana-appindicator' 'libnotify' 'mpv')
          makedepends=('flutter' 'cmake' 'ninja' 'clang')
          source=("\$url/archive/refs/tags/v\$pkgver.tar.gz")
          sha256sums=('SKIP')
          build() {
            cd "NGS-KG-\$pkgver"
            flutter build linux --release
          }
          package() {
            cd "NGS-KG-\$pkgver"
            mkdir -p "\$pkgdir/usr/bin"
            cp -r build/linux/x64/release/bundle/* "\$pkgdir/usr/bin/"
            mkdir -p "\$pkgdir/usr/share/applications"
            cat > "\$pkgdir/usr/share/applications/ngskg-plus.desktop" << DESKTOP
          [Desktop Entry]
          Name=NGS-KG+
          Exec=/usr/bin/ngskg_plus
          Icon=ngskg
          Type=Application
          Categories=Audio;Music;Player;
          DESKTOP
            mkdir -p "\$pkgdir/usr/share/icons/hicolor/256x256/apps"
            cp assets/images/icon.png "\$pkgdir/usr/share/icons/hicolor/256x256/apps/ngskg.png"
          }
          EOF

      - name: ZIP Linux release bundle
        run: |
          cd build/linux/x64/release/bundle
          tar czf ../../../../../dist/ngskg-plus-linux-x64-release.tar.gz .

      - name: ZIP Linux debug bundle
        run: |
          cd build/linux/x64/debug/bundle
          tar czf ../../../../../dist/ngskg-plus-linux-x64-debug.tar.gz .

      - name: Upload release build
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/ngskg-plus-linux-x64-release.tar.gz

      - name: Upload debug build
        uses: actions/upload-artifact@v4
        with:
          name: linux-debug
          path: dist/ngskg-plus-linux-x64-debug.tar.gz

      - name: Upload .deb package
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb

      - name: Upload .flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: dist/*.flatpak

      - name: Upload PKGBUILD
        uses: actions/upload-artifact@v4
        with:
          name: linux-pkgbuild
          path: dist/PKGBUILD

  # ═══════════════════════════════════════════════════════════
  #  Create GitHub Release
  # ═══════════════════════════════════════════════════════════
  release:
    needs: [build-android, build-windows, build-watch, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List all artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_name }}
          body: |
            ## v1.5.0-preview (Nightcord 2.0.0 预览版)

            这是 NGS-KG+ 首个全平台预览版，包含 Windows、Linux、Android 和 Android Watch 四个平台。作为 Nightcord 2.0.0 的预览版本（代号来源于 QQ 群投票，至于为什么选这个，我们也不知道）。从 v1.0.1 以来累计了大量功能开发和重构。

            ### 本版本是什么

            - 播放引擎从 just_audio 换成了 media_kit，底层能力更强
            - 桌面端 UI 全面重写：新的侧边栏导航、DesktopShell、MD3 动效和主题系统
            - 新增播放队列管理、歌词增强、歌单收藏与多选操作
            - 集成了 Navidrome 服务端支持
            - Windows 端做了系统托盘、文件关联、协议处理器、SMTC 等桌面集成
            - Linux 端从 Android 分支移植了播放功能，修复了大量桌面适配问题
            - Android Watch 端新增搜索、播放器、设置页面

            ### 构建产物

            #### Android
            | 架构 | 文件 |
            |------|------|
            | arm64-v8a | `NGS-KG-arm64-v8a-release.apk` |
            | armeabi-v7a | `NGS-KG-armeabi-v7a-release.apk` |
            | x86_64 | `NGS-KG-x86_64-release.apk` |

            #### Windows
            | 架构 | 文件 |
            |------|------|
            | x64 | `ngskg-plus-windows-x64-debug.zip` / `ngskg-plus-windows-x64-release.zip` / `ngskg-plus-windows-x64.msix` |

            #### Linux
            | 格式 | 文件 |
            |------|------|
            | .deb | `ngskg-plus_1.5.0_amd64.deb` |
            | .flatpak | `ngskg-plus.flatpak` |
            | PKGBUILD | `PKGBUILD` |

            > **Arch Linux 用户**：AUR 暂停注册，请使用 Release 中的 PKGBUILD 本地构建：
            > ```bash
            > git clone https://github.com/Tangmjiu/NGS-KG.git --branch linux-desktop
            > cd NGS-KG
            > makepkg -si
            > ```

            #### Android Watch (Wear OS) — Lite
            | 架构 | 文件 |
            |------|------|
            | arm64 | `NGS-KG-watch-release.apk` |

            > Watch 版为精简版，功能较少。需配合 Android 手机使用。

            ### 已知问题

            - 部分功能运行会有异常
          files: |
            artifacts/android-debug-arm64-v8a/*
            artifacts/android-debug-armeabi-v7a/*
            artifacts/android-debug-x86_64/*
            artifacts/android-release-arm64-v8a/*
            artifacts/android-release-armeabi-v7a/*
            artifacts/android-release-x86_64/*
            artifacts/windows-x64-debug-zip/*
            artifacts/windows-x64-release-zip/*
            artifacts/windows-x64-release-msix/*
            artifacts/linux-release/*
            artifacts/linux-debug/*
            artifacts/linux-deb/*
            artifacts/linux-flatpak/*
            artifacts/linux-pkgbuild/*
            artifacts/watch-release-apk/*
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
