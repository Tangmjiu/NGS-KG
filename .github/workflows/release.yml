name: Build Release APK + GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'
      release_name:
        description: 'Release name (e.g. NGS-KG+ v1.0.1)'
        required: true
        default: 'NGS-KG+ v1.0.1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ═══ Cache ═══

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/flutter
          key: flutter-${{ runner.os }}-3.44.0-stable
          restore-keys: |
            flutter-${{ runner.os }}-

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk
          key: android-sdk-${{ runner.os }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install Android SDK
        uses: android-actions/setup-android@v2

      - name: Create assets directories
        run: |
          mkdir -p assets/images
          mkdir -p assets/icons

      - name: Get dependencies
        run: flutter pub get

      # ═══ CI network config: replace China mirrors with global ones ═══
      - name: Use global Gradle/Maven mirrors for CI
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          sed -i '/maven.*aliyun/d' android/settings.gradle android/build.gradle

      # ── Build release APK (split-per-abi) ──
      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      # ── Build debug APK (split-per-abi) ──
      - name: Build debug APK
        run: flutter build apk --debug --split-per-abi

      # ── Upload artifacts ──
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: NGS-KG-${{ github.event.inputs.tag_name }}-release
          path: build/app/outputs/flutter-apk/*-release.apk

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: NGS-KG-${{ github.event.inputs.tag_name }}-debug
          path: build/app/outputs/flutter-apk/*-debug.apk

      # ── Create GitHub Release ──
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_name }}
          body: |
            # NGS-KG+ 更新日志

            ## 新增

            - **Apple Music 风格动态流光播放器背景**：HSL 色彩空间 8 色斑流动光效，5s 循环 + 大半径高斯模糊柔光混色
            - **MD3 设计令牌系统**：AppShape（xs/sm/md/lg/xl/full 圆角体系）、AppMotion（标准/强调/减速/舒缓时长与缓动曲线）、AppBreakpoint（compact/medium/expanded 响应式断点）
            - **跨平台更新检测器**：通过 GitHub Releases API 检查最新版本，识别 Android ABI（arm64-v8a / armeabi-v7a / x86_64）并下载对应 APK
            - **音质设置独立子页面**：原 WiFi/蜂窝/下载三套独立音质设置移入独立子页面，设置组按「播放」「音频」「更新」「关于」重新组织

            ## 变更

            - **Android 包名迁移**：`com.kugou.ngskg` → `com.mjiutang.ngskg`
            - **版本管理统一**：`build.gradle` 从 `pubspec.yaml` 读取版本号，单一源消除漂移
            - **通知歌词纯文本**：移除通知标题中的「♪」前缀
            - **后台服务保活**：切换为 `START_STICKY` + 状态持久化，防止进程回收后静音
            - **MIT 许可证**：项目根目录添加 LICENSE，主要源文件添加 SPDX 头
            - **CI 提速**：debug 构建仅 arm64-v8a 单架构（~25min → ~12min）

            ## 修复

            - 流光背景颜色区域重叠 → per-blob 独立锚点 + 明度钳制 [0.12, 0.85]
            - 锁屏歌词切换延迟 → 流光周期从 10s 优化为 5s
            - 排行榜底部溢出 49px（SafeArea 适配）
            - 日志详情行溢出 8.5px（itemExtent 64→72）
            - 发现页集合字面量语法错误（内联变量表达式）
            - 播放历史 API pagesize 不足导致数据缺失
          files: |
            build/app/outputs/flutter-apk/*-debug.apk
            build/app/outputs/flutter-apk/*-release.apk
          draft: true
          prerelease: false
