name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [android]
  pull_request:
    branches: [android]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'

      - name: Install Android SDK
        uses: android-actions/setup-android@v2

      - name: Create assets directories
        run: |
          mkdir -p assets/images
          mkdir -p assets/icons

      - name: Get dependencies
        run: flutter pub get

      # ── Build debug APK ──
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      # ── Build release APK（自动生成签名证书） ──
      - name: Generate signing keystore
        run: |
          keytool -genkey -v \
            -keystore android/upload-keystore.jks \
            -storetype pkcs12 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload \
            -storepass "ngskg2026" -keypass "ngskg2026" \
            -dname "CN=NGSKG, OU=Dev, O=NGSKG, L=Guangzhou, ST=GD, C=CN"
          # key.properties 已存在于仓库中，自动匹配

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # ── Build release AppBundle（可选） ──
      - name: Build release AppBundle
        run: flutter build appbundle --release

      - name: Upload release AppBundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab
