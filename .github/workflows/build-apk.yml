name: Build Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [android]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ═══ Cache ═══

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/flutter
          key: flutter-${{ runner.os }}-3.44.0-stable
          restore-keys: |
            flutter-${{ runner.os }}-

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk
          key: android-sdk-${{ runner.os }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install Android SDK
        uses: android-actions/setup-android@v2

      - name: Create assets directories
        run: |
          mkdir -p assets/images
          mkdir -p assets/icons

      - name: Get dependencies
        run: flutter pub get

      # ═══ CI network config: replace China mirrors with global ones ═══
      - name: Use global Gradle/Maven mirrors for CI
        run: |
          # Gradle distribution: Tencent → official
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          # Maven mirrors: remove Aliyun (502 in CI), keep google/mavenCentral
          sed -i '/maven.*aliyun/d' android/settings.gradle android/build.gradle

      # ── Build debug APK (仅 arm64-v8a，加快 CI 速度) ──
      - name: Build debug APK
        run: flutter build apk --debug --target-platform android-arm64

      # ── Upload debug APK ──
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NGS-KG-debug-arm64-v8a
          path: build/app/outputs/flutter-apk/app-debug.apk
