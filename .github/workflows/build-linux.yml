name: Build Linux (Debug + Release)

on:
  workflow_dispatch:
  push:
    branches: [linux-desktop]
  pull_request:
    branches: [linux-desktop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libayatana-appindicator3-dev

      # ═══════════════════════════════════════════════════════════
      #  Caches
      # ═══════════════════════════════════════════════════════════

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pubcache-${{ hashFiles('pubspec.lock') }}
          restore-keys: pubcache-

      - name: Create assets directories
        run: |
          mkdir -p assets/images
          mkdir -p assets/icons

      - name: Get dependencies
        run: flutter pub get

      # ── Build debug ──
      - name: Build Linux debug
        run: flutter build linux --debug

      # ── Build release ──
      - name: Build Linux release
        run: flutter build linux --release

      # ── Upload artifacts ──
      - name: Upload debug build
        uses: actions/upload-artifact@v4
        with:
          name: ngskg-linux-debug
          path: build/linux/x64/debug/bundle

      - name: Upload release build
        uses: actions/upload-artifact@v4
        with:
          name: ngskg-linux-release
          path: build/linux/x64/release/bundle
