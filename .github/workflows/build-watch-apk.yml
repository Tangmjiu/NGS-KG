name: Build Watch APK (Debug + Release)

on:
  workflow_dispatch:
  push:
    branches: [watch]
  pull_request:
    branches: [watch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install Android SDK
        uses: android-actions/setup-android@v2

      - name: Install SDK 36
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" 2>/dev/null || true
          sdkmanager --list_installed 2>/dev/null | grep "platforms"

      # ═══════════════════════════════════════════════════════════
      #  Caches
      # ═══════════════════════════════════════════════════════════

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pubcache-${{ hashFiles('pubspec.lock') }}
          restore-keys: pubcache-

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/configuration-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Create assets directories
        run: |
          mkdir -p assets/images
          mkdir -p assets/icons

      - name: Get dependencies
        run: flutter pub get

      # ═══ CI network config: replace China mirrors with global ones ═══
      - name: Use global Gradle/Maven mirrors for CI
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          sed -i '/maven.*aliyun/d' android/settings.gradle android/build.gradle

      # ═══ Signing ═══
      - name: Create key.properties for signing
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=debug.keystore
          EOF

      # ── Build watch debug APK ──
      - name: Build watch debug APK
        run: flutter build apk --debug --target-platform android-arm64 --android-skip-build-dependency-validation

      # ── Build watch release APK ──
      - name: Build watch release APK
        run: flutter build apk --release --target-platform android-arm64

      # ── Upload artifacts ──
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NGS-KG-watch-debug-arm64-v8a
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NGS-KG-watch-release-arm64-v8a
          path: build/app/outputs/flutter-apk/app-release.apk
