# SPDX-License-Identifier: MIT
name: Setup Flutter (Android)
description: >-
  安装 Flutter 与 Android SDK 36、恢复缓存，并把仓库内的国内 Gradle/Maven 源
  切换为 CI 可访问的地址。供 CI / Nightly / Release 工作流复用。

inputs:
  flutter-version:
    description: Flutter SDK 版本
    required: false
    default: '3.44.0'
  cache-prefix:
    description: 缓存键前缀，用于区分调用方
    required: false
    default: 'android'

runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: stable
        cache: true

    # ubuntu runner 自带 Android SDK。这里不使用 android-actions/setup-android@v2：
    # 该版本会尝试安装已下线的 legacy "tools" 包，sdkmanager 会以退出码 1 失败，
    # 导致整个 setup 步骤中断。
    - name: Install Android SDK 36
      shell: bash
      run: |
        sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        sdkmanager="$(command -v sdkmanager || true)"
        if [ -z "$sdkmanager" ]; then
          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
        fi
        if [ -z "$sdkmanager" ]; then
          echo "::error::未找到 sdkmanager（sdk_root=$sdk_root）"
          exit 1
        fi
        echo "sdkmanager: $sdkmanager"

        yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
        yes | "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

        {
          echo "ANDROID_HOME=$sdk_root"
          echo "ANDROID_SDK_ROOT=$sdk_root"
        } >> "$GITHUB_ENV"
        echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"

        "$sdkmanager" --list_installed 2>/dev/null | grep -E 'platforms;android-36|build-tools;36\.0\.0' \
          || echo "::warning::未能确认 SDK 36 已安装"

    - name: Cache pub packages
      uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        key: ${{ inputs.cache-prefix }}-pub-${{ hashFiles('pubspec.lock') }}
        restore-keys: |
          ${{ inputs.cache-prefix }}-pub-

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.gradle/configuration-cache
        key: ${{ inputs.cache-prefix }}-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
        restore-keys: |
          ${{ inputs.cache-prefix }}-gradle-${{ runner.os }}-

    - name: Use CI-accessible Gradle/Maven mirrors
      shell: bash
      run: |
        sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
        sed -i '/maven.*aliyun/d' android/settings.gradle android/build.gradle

    - name: Create asset directories
      shell: bash
      run: |
        mkdir -p assets/images
        mkdir -p assets/icons

    - name: Install dependencies
      shell: bash
      run: flutter pub get
