<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMLL Player</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #000;
      }
      #lyric-player {
        width: 100vw;
        height: 100vh;
        position: relative;
      }
      #lyric-player > canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
      }
      /* 左侧封面区 (清晰大封面, 左 45% 区域垂直居中) */
      #cover-wrap {
        position: absolute;
        top: 0;
        left: 0;
        width: 45vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
        pointer-events: none;
      }
      #cover-art {
        width: min(34vw, 56vh);
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 16px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
        visibility: hidden;
        transition: visibility 0.3s;
      }
      /* 右侧歌词区 (右 55%, 上下各留 10vh 边距, 边缘渐隐过渡) */
      #lyric-player > .amll-lyric-player {
        position: absolute;
        top: 10vh;
        left: 45vw;
        width: 55vw;
        height: 80vh;
        z-index: 1;
        padding: 0 6vw 0 3vw;
        box-sizing: border-box;
        -webkit-mask-image: linear-gradient(to bottom,
            transparent 0%, black 10%, black 90%, transparent 100%);
        mask-image: linear-gradient(to bottom,
            transparent 0%, black 10%, black 90%, transparent 100%);
      }
      /* 暂无歌词提示 (限歌词区域内) */
      #no-lyric {
        position: absolute;
        top: 0;
        left: 45vw;
        width: 55vw;
        height: 100vh;
        z-index: 3;
        display: none;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        color: rgba(255, 255, 255, 0.55);
        font-size: 16px;
        letter-spacing: 2px;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="lyric-player"></div>
    <div id="cover-wrap"><img id="cover-art" alt="" /></div>
    <div id="no-lyric">暂无歌词</div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
